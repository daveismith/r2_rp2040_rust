[pytest]
# Run all tests in asyncio mode automatically (no @pytest.mark.asyncio needed).
asyncio_mode = auto

# Use a single session-scoped event loop so the session-scoped pycyphal node
# fixture shares the same loop as all async tests.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Default test paths (can be overridden on the command line).
testpaths = tests

# Verbose by default for hardware tests.
addopts = -v --tb=short

# Custom markers (also registered in conftest.py for forward compatibility).
markers =
    destructive: marks tests that reboot or erase the DUT (skip with '-m not destructive')
    ota: marks OTA firmware update tests (run with --run-ota)

# Suppress deprecation warnings from third-party DSDL libraries (pydsdl / nunavut).
# These fire during the one-time DSDL compilation and are not actionable by us.
filterwarnings =
    ignore::DeprecationWarning:nunavut.*
    ignore::DeprecationWarning:pydsdl.*
